spring:
  application:
    name: society-document-portal
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/society_portal}
    username: ${DB_USERNAME:society_admin}
    password: ${DB_PASSWORD:society_admin}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 300MB
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  health:
    # The default SMTP host is a placeholder until real mail settings are supplied (see app.mail.enabled),
    # so don't let Actuator's mail probe fail overall health because of it.
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-32-bytes-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@societyportal.local}
  sms:
    enabled: ${SMS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  file-storage:
    root: ${FILE_STORAGE_ROOT:./uploads}
    max-file-size-mb: 25
    allowed-extensions: pdf,doc,docx,xls,xlsx,ppt,pptx,jpg,jpeg,png,zip
    signed-url-ttl-minutes: 10
  otp:
    ttl-minutes: 10
  security:
    max-failed-login-attempts: 5
    lockout-minutes: 15
  approval-sla-days: 3
  society:
    name: ${SOCIETY_NAME:Green Valley Co-operative Housing Society}
