# Local/dev-only nginx config: plain HTTP, no domain or TLS required (unlike
# nginx/templates/app.conf.template, which is the production config and needs both). Used by
# Dockerfile.local + docker-compose.local.yml for the single-command local run - see run.sh.
server {
    listen 80;
    server_name _;

    client_max_body_size 300M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
